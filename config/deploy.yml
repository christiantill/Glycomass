# Required values deliberately have no production defaults.
service: glycomass
image: <%= ENV.fetch("GLYCOMASS_IMAGE") %>
minimum_version: 2.12.0

# Memory and CPU caps: the host (4 vCPU, 8 GB RAM, 2 GB swap) also runs other
# services, so Glycomass keeps to a small share and a runaway job hits its own
# container's limit instead of starving the host. Each cap allows a quarter extra as
# swap (memory-swap - memory) so idle pages can move out before the kernel kills
# anything. CPU caps are ceilings, not reservations: idle containers use none.
# Measurements behind these numbers: deploy/README.md.
servers:
  web:
    hosts:
      - <%= ENV.fetch("GLYCOMASS_DEPLOY_HOST") %>
    options:
      # The mass calculators run here. NumPy releases the GIL, so concurrent
      # calculations use more than one core; 2 CPUs keep the heaviest request as
      # fast as uncapped for one user. 8 concurrent ones peaked at 160 MiB.
      memory: 512m
      memory-swap: 640m
      cpus: 2.0
  worker:
    hosts:
      - <%= ENV.fetch("GLYCOMASS_DEPLOY_HOST") %>
    cmd: worker
    proxy: false
    stop_timeout: 330
    # The worker only runs identifier jobs. While GLYCOMASS_IDENTIFIER_ENABLED is
    # false it receives no new jobs, so it idles (about 60 MiB, no CPU) and only
    # finishes jobs queued before the switch: one CPU lets even a 250 MB job finish
    # within the 5-minute job timeout. It stays deployed so that re-enabling needs no
    # role changes. When the identifier is enabled again, raise these caps first:
    # it is still being developed and will need more, e.g. memory 2g,
    # memory-swap 2560m, cpus 1.5, then re-measure (deploy/README.md).
    options:
      memory: 384m
      memory-swap: 480m
      cpus: 1.0

proxy:
  ssl: true
  forward_headers: true
  hosts:
<% ENV.fetch("GLYCOMASS_DEPLOY_DOMAIN").split(",").each do |domain| %>
    - <%= domain.strip %>
<% end %>
  app_port: 8000
  buffering:
    max_request_body: 262144000
  healthcheck:
    path: /api/v1/health
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

ssh:
  user: <%= ENV.fetch("GLYCOMASS_DEPLOY_USER", "root") %>

env:
  clear:
    GLYCOMASS_ENVIRONMENT: production
    GLYCOMASS_LOG_JSON: true
    GLYCOMASS_REDIS_URL: redis://glycomass-redis:6379/0
    GLYCOMASS_UPLOAD_DIR: /data/uploads
    GLYCOMASS_RESULT_DIR: /data/results
    # Temporarily off while the identifier is being developed: new uploads are
    # refused; earlier results stay downloadable. See the worker caps above.
    GLYCOMASS_IDENTIFIER_ENABLED: false
  secret:
    - GLYCOMASS_DATABASE_URL

# Both roles must run on the same host and mount the same persistent storage.
# Prepare this directory with uid/gid 10001 before the first deploy.
volumes:
  - /var/lib/glycomass/files:/data

accessories:
  # Accessory options apply only when the accessory container is recreated
  # (`kamal accessory reboot <name>`); `kamal deploy` leaves running accessories as they are.
  postgres:
    image: postgres:17-alpine
    options:
      # Default settings (shared_buffers 128 MB) fit well inside this cap.
      memory: 512m
      memory-swap: 640m
      cpus: 0.5
    host: <%= ENV.fetch("GLYCOMASS_DEPLOY_HOST") %>
    env:
      clear:
        POSTGRES_USER: glycomass
        POSTGRES_DB: glycomass
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /var/lib/glycomass/postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    options:
      # Job queue only (arq), not a cache: no eviction policy, queued jobs must not be dropped.
      memory: 128m
      memory-swap: 160m
      cpus: 0.25
    host: <%= ENV.fetch("GLYCOMASS_DEPLOY_HOST") %>
    cmd: redis-server --appendonly yes
    directories:
      - /var/lib/glycomass/redis:/data
