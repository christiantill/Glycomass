# Required values deliberately have no production defaults.
service: glycomass
image: <%= ENV.fetch("GLYCOMASS_IMAGE") %>
minimum_version: 2.12.0

# Memory and CPU caps: the host (4 vCPU, 8 GB RAM, 2 GB swap) also runs other
# services, so Glycomass keeps to a small share and a runaway job hits its own
# container's limit instead of starving the host. Each cap allows a quarter extra as
# swap (memory-swap - memory) so idle pages can move out before the kernel kills
# anything. Measurements behind these numbers: deploy/README.md.
servers:
  web:
    hosts:
      - <%= ENV.fetch("GLYCOMASS_DEPLOY_HOST") %>
    options:
      memory: 512m        # uploads stream to disk; calculations need tens of MB
      memory-swap: 640m
      cpus: 0.5
  worker:
    hosts:
      - <%= ENV.fetch("GLYCOMASS_DEPLOY_HOST") %>
    cmd: worker
    proxy: false
    stop_timeout: 330
    options:
      # One job at a time (max_jobs = 1). The identifier child streams the MGF one
      # spectrum at a time: at most about 150 MB for a 250 MB upload. A child over the
      # cap is OOM-killed and its job fails with an out-of-memory message; the arq
      # parent keeps running. The child is single-threaded, so one CPU is enough.
      memory: 1g
      memory-swap: 1280m
      cpus: 1.0

proxy:
  ssl: true
  forward_headers: true
  hosts:
<% ENV.fetch("GLYCOMASS_DEPLOY_DOMAIN").split(",").each do |domain| %>
    - <%= domain.strip %>
<% end %>
  app_port: 8000
  buffering:
    max_request_body: 262144000
  healthcheck:
    path: /api/v1/health
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

ssh:
  user: <%= ENV.fetch("GLYCOMASS_DEPLOY_USER", "root") %>

env:
  clear:
    GLYCOMASS_ENVIRONMENT: production
    GLYCOMASS_LOG_JSON: true
    GLYCOMASS_REDIS_URL: redis://glycomass-redis:6379/0
    GLYCOMASS_UPLOAD_DIR: /data/uploads
    GLYCOMASS_RESULT_DIR: /data/results
  secret:
    - GLYCOMASS_DATABASE_URL

# Both roles must run on the same host and mount the same persistent storage.
# Prepare this directory with uid/gid 10001 before the first deploy.
volumes:
  - /var/lib/glycomass/files:/data

accessories:
  # Accessory options apply only when the accessory container is recreated
  # (`kamal accessory reboot <name>`); `kamal deploy` leaves running accessories as they are.
  postgres:
    image: postgres:17-alpine
    options:
      # Default settings (shared_buffers 128 MB) fit well inside this cap.
      memory: 512m
      memory-swap: 640m
      cpus: 0.5
    host: <%= ENV.fetch("GLYCOMASS_DEPLOY_HOST") %>
    env:
      clear:
        POSTGRES_USER: glycomass
        POSTGRES_DB: glycomass
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /var/lib/glycomass/postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    options:
      # Job queue only (arq), not a cache: no eviction policy, queued jobs must not be dropped.
      memory: 128m
      memory-swap: 160m
      cpus: 0.25
    host: <%= ENV.fetch("GLYCOMASS_DEPLOY_HOST") %>
    cmd: redis-server --appendonly yes
    directories:
      - /var/lib/glycomass/redis:/data
