# Isolated local integration test, not a production deployment.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glycomass
      POSTGRES_PASSWORD: smoke-only
      POSTGRES_DB: glycomass
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U glycomass"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    image: glycomass:deployment-test
    environment: &app-env
      GLYCOMASS_DATABASE_URL: postgresql+asyncpg://glycomass:smoke-only@postgres/glycomass
      GLYCOMASS_REDIS_URL: redis://redis:6379/0
    volumes:
      - files:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    image: glycomass:deployment-test
    command: worker
    environment: *app-env
    volumes:
      - files:/data
    depends_on:
      web:
        condition: service_healthy
volumes:
  files:
