{% extends "base.html" %}
{% block title %}Glycopeptide calculator · GlycoMass{% endblock %}
{% block content %}
<span class="eyebrow">Calculator</span>
<h1 style="font-family:var(--font-display);font-weight:400;font-size:var(--step-3);color:var(--paper);margin:.6rem 0 1.6rem">Glycopeptide</h1>
<div class="calc-shell">
  <form class="calc-form" hx-post="/peptide" hx-target="#result" hx-swap="innerHTML" hx-disabled-elt="find button[type=submit]" hx-sync="this:drop" aria-busy="false">
    <div><label for="peptide-sequence">Peptide sequence</label><input id="peptide-sequence" type="text" name="sequence" maxlength="100" value="{{ inputs.sequence }}"></div>
    <div class="calc-grid">
      <div><label for="peptide-hex">Hex</label><input id="peptide-hex" type="number" name="hex" value="{{ inputs.hex }}" min="0"></div>
      <div><label for="peptide-hexnac">HexNAc</label><input id="peptide-hexnac" type="number" name="hexnac" value="{{ inputs.hexnac }}" min="0"></div>
      <div><label for="peptide-fuc">Fuc</label><input id="peptide-fuc" type="number" name="fuc" value="{{ inputs.fuc }}" min="0"></div>
      <div><label for="peptide-sia">Sia</label><input id="peptide-sia" type="number" name="sia" value="{{ inputs.sia }}" min="0"></div>
      <div><label for="peptide-charge">Charge</label><input id="peptide-charge" type="number" name="charge" value="{{ inputs.charge }}"></div>
      <div><label for="peptide-deamidation">Deamidation</label><input id="peptide-deamidation" type="number" name="deamidation" value="{{ inputs.deamidation }}" min="0"></div>
    </div>
    <label for="peptide-carbamidomethyl" style="display:flex;gap:.5rem;align-items:center;text-transform:none;letter-spacing:0">
      <input id="peptide-carbamidomethyl" type="checkbox" name="carbamidomethyl" value="true" style="width:auto" {% if inputs.carbamidomethyl %}checked{% endif %}> Carbamidomethyl (Cys)
    </label>
    <button class="btn btn-primary" type="submit"><span class="calculate-idle">Calculate</span><span class="calculate-busy" aria-hidden="true">Calculating…</span></button>
    <p class="calculation-status" role="status" aria-live="polite"></p>
  </form>
  <div id="result" class="result-panel">{% if result %}{% include "_result.html" %}{% else %}<p style="color:var(--muted)">Enter a peptide and calculate.</p>{% endif %}</div>
</div>
{% endblock %}
