<div class="result-readout">
  <div><div class="k">Monoisotopic</div><div class="v">{{ "%.4f"|format(result.mono_mz) }}<small>m/z</small></div></div>
  <div><div class="k">Most abundant</div><div class="v">{{ "%.4f"|format(result.most_abundant_mz) }}<small>m/z</small></div></div>
  <div><div class="k">Formula</div><div class="v" style="font-size:.95rem">{{ result.composition }}</div></div>
</div>
<div class="spectrum-widget">
  <div class="spectrum-header">
    <p class="spectrum-caption">Theoretical isotope spectrum</p>
    {% if result.profile %}
    <div class="spectrum-modes" role="group" aria-label="Spectrum view">
      <button type="button" data-spectrum-mode="profile" aria-pressed="false">Profile</button>
      <button type="button" data-spectrum-mode="peaks" aria-pressed="true">Peaks</button>
    </div>
    {% endif %}
  </div>
  <div role="img" aria-label="Theoretical isotope stick spectrum. Horizontal axis: m/z. Vertical axis: relative intensity, normalized to 100 percent." class="spectrum"
       data-spectrum='{{ result.spectrum.model_dump()|tojson }}'{% if result.profile %} data-profile='{{ result.profile|display_profile|tojson }}'{% endif %}></div>
</div>
{% if slug %}
<div class="permalink">
  <a href="/c/{{ slug }}">🔗 Permalink</a>
  <button type="button" class="permalink-copy" data-copy="/c/{{ slug }}">Copy link</button>
</div>
{% endif %}
