[project]
name = "glycomass"
version = "0.1.0"
description = "Exact masses and isotope spectra for glycans, glycopeptides and glycoproteins."
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.0",
    "brain-isotopic-distribution==1.5.19",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glycomass"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
exclude = ["app", "glycomass.py", "proteincalc_temp.py", "config.py", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/glycomass"]
[[tool.mypy.overrides]]
module = ["brainpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=src/glycomass --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
[tool.coverage.report]
fail_under = 80
