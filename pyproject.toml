[project]
name = "glycomass"
version = "0.1.0"
description = "Exact masses and isotope spectra for glycans, glycopeptides and glycoproteins."
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.0",
    "brain-isotopic-distribution==1.5.19",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "pyteomics>=4.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "arq>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
glycomass-api = "glycomass.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glycomass"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
exclude = ["app", "glycomass.py", "proteincalc_temp.py", "config.py", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/glycomass"]
[[tool.mypy.overrides]]
module = ["brainpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=src/glycomass --cov-report=term-missing --cov-fail-under=80 -m 'not grid'"
testpaths = ["tests"]
markers = [
    "grid: comprehensive legacy-parity grid (~800 cases, slow); run with: uv run pytest -m grid --no-cov",
]

[tool.coverage.run]
branch = true
[tool.coverage.report]
fail_under = 80
